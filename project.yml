name: WakeMove
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  WakeMove:
    type: application
    platform: iOS
    sources:
      - path: .
        includes: ["*.swift"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.wakemove
        PRODUCT_NAME: WakeMove
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 醒動鬧鐘
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: 偵測起床動作需要使用前鏡頭,影像只在手機上即時處理,不會上傳或儲存。
        CODE_SIGNING_ALLOWED: NO
